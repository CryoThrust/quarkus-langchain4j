quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:default-memory;DB_CLOSE_DELAY=-1
quarkus.datasource.other.db-kind=h2
quarkus.datasource.other.jdbc.url=jdbc:h2:mem:other-memory;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.packages=io.quarkiverse.langchain4j.prototype.memory.model
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm."other".datasource=other
quarkus.hibernate-orm."other".packages=io.quarkiverse.langchain4j.prototype.memory.model
quarkus.hibernate-orm."other".schema-management.strategy=drop-and-create
quarkus.devservices.enabled=false
